<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>지라 번역 — 설정</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 28px 30px 40px;
        max-width: 640px;
        font: 400 14px/1.65 -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 18px; }
      p.sub { margin: 0 0 24px; opacity: 0.65; font-size: 13px; }
      section { margin-bottom: 22px; }
      label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; opacity: 0.75; }
      input, select {
        width: 100%;
        padding: 7px 9px;
        font: inherit;
        font-size: 13px;
        border: 1px solid rgba(128, 128, 128, 0.45);
        border-radius: 5px;
        background: Canvas;
        color: CanvasText;
        box-sizing: border-box;
      }
      button {
        padding: 7px 14px;
        font: 600 13px/1 inherit;
        color: #fff;
        background: #0c66e4;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
      }
      .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
      .status { font-size: 13px; }
      .ok { color: #2a7f3f; }
      .bad { color: #b3452b; }
      .hint { margin-top: 8px; font-size: 12px; opacity: 0.62; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>지라 번역</h1>
    <p class="sub">번역은 이 컴퓨터에서 도는 컨디션 매니저 앱이 처리합니다. API 키는 브라우저에 저장되지 않습니다.</p>

    <section>
      <label for="lang">번역 언어</label>
      <select id="lang">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="zh">简体中文</option>
        <option value="vi">Tiếng Việt</option>
      </select>
    </section>

    <section>
      <label for="token">연결 토큰</label>
      <input id="token" type="password" placeholder="설치 스크립트를 쓰면 자동으로 채워집니다" autocomplete="off" />
      <div class="hint">
        토큰은 앱이 만들어 <code>~/.condition-mate/jira-bridge/token</code> 에 둡니다.
        <code>Scripts/install-jira-ext.sh</code> 로 설치했다면 이 칸은 비워 두어도 됩니다.
      </div>
    </section>

    <div class="row">
      <button id="check" type="button">연결 확인</button>
      <span class="status" id="status"></span>
    </div>

    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
